# Runs the fast checks before each commit. Install once with:
#   pip install pre-commit && pre-commit install
# Uses the tools from your environment (pip install -e ".[dev]"), so no network is needed.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: python -m mypy src
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: python -m bandit -q -c pyproject.toml -r src
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest-fast
        name: pytest (quick)
        entry: python -m pytest -q -x -p no:randomly
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
