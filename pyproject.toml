[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpguard"
version = "1.0.0rc1"
description = "A security gateway for Model Context Protocol servers: policy, detection and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "hypothesis>=6.100", "tomli-w>=1.0",
       "bandit>=1.9.4", "vulture>=2.11", "pip-audit>=2.7", "pre-commit>=3.5"]

[project.scripts]
mcpguard = "mcpguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpguard = ["dashboard.html", "py.typed", "data/iocs.json", "data/injection_model.json", "data/confusables.json", "data/advisories.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With PYTHONWARNDEFAULTENCODING=1 (scripts/check.py and CI set it), text I/O that relies on
# the platform encoding fails the run. On Windows that encoding is not UTF-8.
filterwarnings = ["error::EncodingWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, simplify, ruff, blind-except, bandit rules,
# comprehensions, misc lints, pytest style, performance, no print in library code.
select = ["E", "F", "W", "B", "UP", "SIM", "RUF", "BLE", "S", "C4", "PIE", "PT", "PERF", "T20"]
ignore = ["RUF001", "RUF012", "S603", "S607"]  # subprocess use is the product: launching configured servers

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106", "S108", "S110", "S310", "S311", "T20", "PT011", "BLE001"]
"tests/hostile_server.py" = ["E501", "E701", "E702", "S101", "PTH", "SIM", "PLR", "RUF", "BLE001", "PERF", "S110", "S112", "I"]  # a compact attack fixture
"src/mcpguard/cli.py" = ["T20"]  # the CLI prints by design
"scripts/*" = ["T20", "S"]
"scripts/vulture_whitelist.py" = ["B018", "F821"]  # vulture's whitelist format

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true

[tool.coverage.run]
source = ["mcpguard"]
branch = true
patch = ["subprocess"]  # measure `mcpguard run` started by the stdio tests too

[tool.coverage.report]
fail_under = 88
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "pragma: no cover", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B404", "B603"]  # subprocess import/use: launching configured MCP servers is the product
